<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#050508"/>
<title>Link not found · Datapad</title>
<link rel="icon" href="/logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'Outfit',system-ui,sans-serif;background:#050508;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:520px;width:100%;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:40px 32px;text-align:center}
  .code{font-family:'DM Mono',monospace;font-size:64px;font-weight:700;background:linear-gradient(135deg,#00ff88,#7df0b8);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  h1{font-size:22px;font-weight:600;margin:14px 0 6px}
  p{color:#9aa;font-size:14px;line-height:1.6;margin-bottom:8px}
  .key{font-family:'DM Mono',monospace;font-size:12px;color:#7df0b8;background:rgba(0,255,136,.06);border:1px solid rgba(0,255,136,.18);padding:4px 10px;border-radius:6px;display:inline-block;margin:8px 0 22px;word-break:break-all}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-block;padding:10px 18px;border-radius:999px;font:600 13px 'Outfit',sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:#fff;transition:all .2s}
  .btn:hover{background:rgba(0,255,136,.12);border-color:rgba(0,255,136,.4);color:#7df0b8}
  .btn.primary{background:linear-gradient(135deg,#00ff88,#7df0b8);color:#050508;border-color:transparent}
  .btn.primary:hover{filter:brightness(1.1);color:#050508}
  .foot{margin-top:22px;font-size:11px;color:#667}
  .foot a{color:#9aa;text-decoration:none}
  .foot a:hover{color:#7df0b8}
</style>
</head><body>
<main class="card">
  <div class="code">404</div>
  <h1>This link doesn't exist</h1>
  <p>The short link you followed isn't active — it may have expired, been disabled, or never existed.</p>
  <div class="key" id="key" style="display:none"></div>
  <div class="actions">
    <a class="btn primary" href="/">Go to Datapad</a>
    <a class="btn" href="javascript:history.back()">Back</a>
  </div>
  <div class="foot">Powered by <a href="/">datapad.in</a></div>
</main>
<script>
(function(){
  var k=new URLSearchParams(location.search).get('k');
  if(k){ var el=document.getElementById('key'); el.textContent='/go/'+k; el.style.display='inline-block'; }
})();
</script>
</body></html>
