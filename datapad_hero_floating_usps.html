
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .hero-shell {
    background: #050508;
    width: 100%;
    min-height: 420px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    font-family: 'Outfit', 'DM Sans', sans-serif;
  }
  .grid-lines {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 90% 90% at 50% 50%, black 20%, transparent 100%);
    pointer-events: none;
  }
  .glow-lt {
    position: absolute; width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,255,136,0.07) 0%, transparent 70%);
    top: -120px; left: -60px; pointer-events: none;
  }
  .glow-rb {
    position: absolute; width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,212,255,0.05) 0%, transparent 70%);
    bottom: -80px; right: -40px; pointer-events: none;
  }

  .hero-left {
    position: relative; z-index: 2;
    padding: 60px 0 60px 48px;
    flex: 0 0 auto;
    width: 50%;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 11px;
    background: rgba(0,255,136,0.06);
    border: 1px solid rgba(0,255,136,0.15);
    border-radius: 100px;
    font-size: 10px; font-weight: 500; color: #00ff88;
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 24px;
    font-family: 'DM Mono', monospace;
  }
  .dot-pulse {
    width: 5px; height: 5px; border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px rgba(0,255,136,0.8);
    animation: dpulse 2s infinite;
  }
  @keyframes dpulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .hero-title {
    font-size: 58px; font-weight: 800; line-height: 1.04;
    letter-spacing: -2.5px; color: #fff;
  }
  .hero-title .line { display: block; }
  .hero-title .accent { color: #00ff88; }
  .hero-title .line:nth-child(1) { animation: fadeup 0.7s 0.2s both; }
  .hero-title .line:nth-child(2) { animation: fadeup 0.7s 0.55s both; }
  .hero-title .line:nth-child(3) { animation: fadeup 0.7s 0.9s both; }
  @keyframes fadeup { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:none} }

  .hero-sub {
    margin-top: 20px; font-size: 15px; color: #6e6e82; line-height: 1.7;
    max-width: 320px; animation: fadeup 0.7s 1.2s both;
  }
  .hero-ctas {
    display: flex; align-items: center; gap: 12px; margin-top: 28px;
    animation: fadeup 0.7s 1.4s both;
  }
  .btn-p {
    padding: 10px 20px; background: #00ff88; color: #050508;
    border-radius: 10px; font-size: 13px; font-weight: 700;
    border: 2px solid #00ff88; cursor: pointer;
    transition: background 0.25s, color 0.25s;
    font-family: inherit;
  }
  .btn-p:hover { background: transparent; color: #00ff88; }
  .btn-g {
    padding: 10px 20px; background: transparent; color: #c8c8d4;
    border-radius: 10px; font-size: 13px; font-weight: 500;
    border: 1px solid rgba(255,255,255,0.08); cursor: pointer;
    transition: all 0.2s; font-family: inherit;
  }
  .btn-g:hover { border-color: rgba(255,255,255,0.18); color: #fff; }

  .bubble-stage {
    position: absolute;
    top: 0; right: 0;
    width: 50%; height: 100%;
    z-index: 1;
  }

  .bubble {
    position: absolute;
    border-radius: 9999px;
    border: 1px solid rgba(0,255,136,0.18);
    background: rgba(0,255,136,0.04);
    backdrop-filter: blur(2px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
    cursor: default;
    will-change: transform;
    transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
    user-select: none;
  }
  .bubble:hover {
    border-color: rgba(0,255,136,0.5);
    background: rgba(0,255,136,0.09);
    box-shadow: 0 0 30px rgba(0,255,136,0.12), inset 0 0 20px rgba(0,255,136,0.04);
  }
  .bubble svg { flex-shrink: 0; }
  .b-label {
    font-size: 11px; font-weight: 600; color: #c8c8d4;
    text-align: center; line-height: 1.3;
    padding: 0 8px;
    pointer-events: none;
  }
  .b-sub {
    font-size: 9.5px; color: #4e4e62;
    text-align: center;
    padding: 0 8px;
    pointer-events: none;
  }
  .b-ring {
    position: absolute; inset: -8px;
    border-radius: 9999px;
    border: 1px dashed rgba(0,255,136,0.08);
    animation: spin-ring linear infinite;
    pointer-events: none;
  }
  @keyframes spin-ring { to { transform: rotate(360deg); } }

  .conn-svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none; overflow: visible;
  }
  .conn-line {
    stroke: rgba(0,255,136,0.06);
    stroke-width: 0.5;
    fill: none;
    stroke-dasharray: 4 6;
    animation: dashflow 3s linear infinite;
  }
  @keyframes dashflow { to { stroke-dashoffset: -20; } }

  .hint {
    position: absolute; bottom: 16px; right: 24px;
    font-size: 10px; color: #2a2a3a;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.5px;
    animation: fadeup 1s 2s both;
  }
</style>

<div class="hero-shell" id="heroShell">
  <div class="grid-lines"></div>
  <div class="glow-lt"></div>
  <div class="glow-rb"></div>

  <div class="hero-left">
    <div class="eyebrow"><span class="dot-pulse"></span> Developer Power Tools</div>
    <h1 class="hero-title">
      <span class="line">Analyse.</span>
      <span class="line">Validate.</span>
      <span class="line accent">Ship faster.</span>
    </h1>
    <p class="hero-sub">Free, browser-based tools for developers and growth teams — all running locally, zero tracking.</p>
    <div class="hero-ctas">
      <button class="btn-p">Explore Tools ↗</button>
      <button class="btn-g">Try A/B Calculator</button>
    </div>
  </div>

  <div class="bubble-stage" id="stage">
    <svg class="conn-svg" id="connSvg"></svg>
  </div>

  <div class="hint">hover to repel</div>
</div>

<script>
const usps = [
  {
    label: "No data leaves\nyour browser",
    sub: "100% client-side",
    icon: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
    size: 108, speed: 0.38, ringDur: "22s"
  },
  {
    label: "No sign-up\nrequired",
    sub: "Open and use instantly",
    icon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>`,
    size: 92, speed: 0.52, ringDur: "18s"
  },
  {
    label: "Instant\nresults",
    sub: "No server round-trips",
    icon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
    size: 84, speed: 0.6, ringDur: "14s"
  },
  {
    label: "Completely\nfree, forever",
    sub: "No paywall ever",
    icon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>`,
    size: 98, speed: 0.44, ringDur: "20s"
  },
  {
    label: "Works\noffline",
    sub: "After initial load",
    icon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4z"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>`,
    size: 88, speed: 0.56, ringDur: "16s"
  }
];

const stage = document.getElementById('stage');
const connSvg = document.getElementById('connSvg');
const shell = document.getElementById('heroShell');

let W, H;
const bubbles = [];
const conns = [];

function resize() {
  W = stage.offsetWidth;
  H = stage.offsetHeight;
  connSvg.setAttribute('viewBox', `0 0 ${W} ${H}`);
}

resize();

const PADDING = [60, 30, 60, 20];

function randPos(size) {
  return {
    x: PADDING[3] + Math.random() * (W - size - PADDING[1] - PADDING[3]),
    y: PADDING[0] + Math.random() * (H - size - PADDING[2] - PADDING[0])
  };
}

function overlaps(ax, ay, aw, bx, by, bw) {
  const dist = Math.hypot(ax + aw/2 - bx - bw/2, ay + aw/2 - by - bw/2);
  return dist < (aw + bw) / 2 + 14;
}

usps.forEach((usp, i) => {
  let pos, tries = 0;
  do {
    pos = randPos(usp.size);
    tries++;
  } while (tries < 30 && bubbles.some(b => overlaps(pos.x, pos.y, usp.size, b.x, b.y, b.size)));

  const el = document.createElement('div');
  el.className = 'bubble';
  el.style.width = usp.size + 'px';
  el.style.height = usp.size + 'px';
  el.innerHTML = `
    <div class="b-ring" style="animation-duration:${usp.ringDur}"></div>
    ${usp.icon}
    <div class="b-label">${usp.label.replace('\n','<br>')}</div>
    <div class="b-sub">${usp.sub}</div>
  `;
  stage.appendChild(el);

  const angle = Math.random() * Math.PI * 2;
  const b = {
    el, size: usp.size, speed: usp.speed,
    x: pos.x, y: pos.y,
    vx: Math.cos(angle) * usp.speed,
    vy: Math.sin(angle) * usp.speed,
    rx: 0, ry: 0
  };
  bubbles.push(b);
});

bubbles.forEach((b, i) => {
  bubbles.forEach((c, j) => {
    if (j <= i) return;
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('class','conn-line');
    connSvg.appendChild(line);
    conns.push({ line, a: b, b: c });
  });
});

let mx = -9999, my = -9999;
shell.addEventListener('mousemove', e => {
  const r = stage.getBoundingClientRect();
  mx = e.clientX - r.left;
  my = e.clientY - r.top;
});
shell.addEventListener('mouseleave', () => { mx = -9999; my = -9999; });

const REPEL = 130;
const REPEL_FORCE = 3.2;
const DAMP = 0.97;
const RETURN = 0.025;

function tick() {
  bubbles.forEach(b => {
    const cx = b.x + b.size / 2;
    const cy = b.y + b.size / 2;

    const dx = cx - mx;
    const dy = cy - my;
    const dist = Math.hypot(dx, dy);

    if (dist < REPEL && dist > 0.1) {
      const force = (REPEL - dist) / REPEL * REPEL_FORCE;
      b.vx += (dx / dist) * force * 0.12;
      b.vy += (dy / dist) * force * 0.12;
    }

    b.vx += (Math.random() - 0.5) * 0.04;
    b.vy += (Math.random() - 0.5) * 0.04;
    b.vx *= DAMP;
    b.vy *= DAMP;

    b.x += b.vx;
    b.y += b.vy;

    if (b.x < 0) { b.x = 0; b.vx = Math.abs(b.vx) * 0.6; }
    if (b.y < 0) { b.y = 0; b.vy = Math.abs(b.vy) * 0.6; }
    if (b.x + b.size > W) { b.x = W - b.size; b.vx = -Math.abs(b.vx) * 0.6; }
    if (b.y + b.size > H) { b.y = H - b.size; b.vy = -Math.abs(b.vy) * 0.6; }

    bubbles.forEach(c => {
      if (c === b) return;
      const ddx = (b.x + b.size/2) - (c.x + c.size/2);
      const ddy = (b.y + b.size/2) - (c.y + c.size/2);
      const d = Math.hypot(ddx, ddy);
      const minD = (b.size + c.size) / 2 + 10;
      if (d < minD && d > 0.1) {
        const push = (minD - d) / minD * 0.5;
        b.vx += (ddx / d) * push;
        b.vy += (ddy / d) * push;
      }
    });

    b.el.style.left = b.x + 'px';
    b.el.style.top = b.y + 'px';
  });

  conns.forEach(({ line, a, b }) => {
    const ax = a.x + a.size / 2, ay = a.y + a.size / 2;
    const bx = b.x + b.size / 2, by = b.y + b.size / 2;
    const d = Math.hypot(ax - bx, ay - by);
    const alpha = Math.max(0, 1 - d / 260);
    line.setAttribute('x1', ax); line.setAttribute('y1', ay);
    line.setAttribute('x2', bx); line.setAttribute('y2', by);
    line.style.opacity = alpha.toFixed(2);
  });

  requestAnimationFrame(tick);
}

tick();
window.addEventListener('resize', resize);
</script>
