<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Datapad – Excel Insights</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* Base */
body {
  margin: 0;
  font-family: 'Outfit', sans-serif;
  background: radial-gradient(circle at 30% 20%, #0a0f1a, #05070d);
  color: #e5e7eb;
}

/* Container */
.container {
  max-width: 1200px;
  margin: auto;
  padding: 40px 20px;
}

/* Hero */
.hero {
  text-align: center;
  margin-bottom: 40px;
}

.hero h1 {
  font-size: 42px;
  font-weight: 700;
}

.hero span {
  color: #00ff88;
}

.hero p {
  color: #9ca3af;
  margin-top: 10px;
}

/* Upload Box */
.upload-box {
  border: 1px dashed rgba(255,255,255,0.2);
  border-radius: 14px;
  padding: 40px;
  text-align: center;
  margin-bottom: 40px;
  background: rgba(255,255,255,0.02);
  backdrop-filter: blur(10px);
  transition: 0.3s;
}

.upload-box:hover {
  border-color: #00ff88;
  background: rgba(0,255,136,0.05);
}

.upload-box input {
  display: none;
}

.upload-label {
  cursor: pointer;
  display: inline-block;
}

.upload-label strong {
  color: #00ff88;
}

/* Main Layout */
.dashboard {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 20px;
}

/* Left Panel */
.sidebar {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 20px;
}

.sidebar h3 {
  font-size: 14px;
  margin-bottom: 10px;
  color: #9ca3af;
}

.column {
  padding: 8px 10px;
  border-radius: 8px;
  margin-bottom: 6px;
  background: rgba(255,255,255,0.04);
  font-size: 13px;
}

/* Right Panel */
.main {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Insight Cards */
.insights {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.card {
  padding: 16px;
  border-radius: 14px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
}

.card h4 {
  font-size: 13px;
  color: #9ca3af;
}

.card p {
  font-size: 18px;
  font-weight: 600;
  margin-top: 6px;
}

/* Chart placeholders */
.chart {
  height: 200px;
  border-radius: 14px;
  background: rgba(255,255,255,0.02);
  border: 1px dashed rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #6b7280;
  font-size: 13px;
}

/* Footer note */
.note {
  text-align: center;
  margin-top: 40px;
  font-size: 12px;
  color: #6b7280;
}

</style>
</head>

<body>

<div class="container">

  <!-- Hero -->
  <div class="hero">
    <h1>Drop your Excel. <span>Get insights.</span></h1>
    <p>No setup. No dashboards. Just answers.</p>
  </div>

  <!-- Upload -->
  <div class="upload-box">
    <label class="upload-label">
      <strong>Click to upload</strong> or drag your file here
      <input type="file" id="fileInput" accept=".csv">
    </label>
  </div>

  <!-- Dashboard -->
  <div class="dashboard">

    <!-- Sidebar -->
    <div class="sidebar">
      <h3>Columns</h3>
      <div class="column">date</div>
      <div class="column">city</div>
      <div class="column">revenue</div>

      <h3 style="margin-top:20px;">Filters</h3>
      <div class="column">Last 7 days</div>
      <div class="column">Top Cities</div>
    </div>

    <!-- Main -->
    <div class="main">

      <!-- Insights -->
      <div class="insights">
        <div class="card">
          <h4>Total Revenue</h4>
          <p>₹12.4L</p>
        </div>
        <div class="card">
          <h4>Growth</h4>
          <p style="color:#00ff88;">+8.2%</p>
        </div>
        <div class="card">
          <h4>Top City</h4>
          <p>Bangalore</p>
        </div>
      </div>

      <!-- Charts -->
      <div class="chart">Trend Chart (auto-generated)</div>
      <div class="chart">Category Breakdown</div>

    </div>

  </div>

  <div class="note">
    Everything runs locally. No data leaves your browser.
  </div>

</div>

</body>
</html>
<script>

const fileInput = document.getElementById('fileInput');

fileInput.addEventListener('change', handleFile);

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(event) {
    const text = event.target.result;
    const data = parseCSV(text);

    processData(data);
  };

  reader.readAsText(file);
}


/* ---------- CSV PARSER ---------- */
function parseCSV(text) {
  const rows = text.trim().split('\n');
  const headers = rows[0].split(',');

  return rows.slice(1).map(row => {
    const values = row.split(',');
    let obj = {};
    headers.forEach((h, i) => obj[h.trim()] = values[i]?.trim());
    return obj;
  });
}


/* ---------- PROCESS DATA ---------- */
function processData(data) {
  if (!data.length) return;

  const columns = Object.keys(data[0]);

  // detect numeric columns
  const numericCols = columns.filter(col =>
    data.every(row => !isNaN(parseFloat(row[col])))
  );

  // detect categorical columns
  const categoricalCols = columns.filter(col =>
    !numericCols.includes(col)
  );

  renderColumns(columns);
  generateInsights(data, numericCols, categoricalCols);
}


/* ---------- RENDER COLUMNS ---------- */
function renderColumns(columns) {
  const sidebar = document.querySelector('.sidebar');
  sidebar.innerHTML = '<h3>Columns</h3>';

  columns.forEach(col => {
    const div = document.createElement('div');
    div.className = 'column';
    div.innerText = col;
    sidebar.appendChild(div);
  });
}


/* ---------- INSIGHTS ---------- */
function generateInsights(data, numericCols, categoricalCols) {

  const insightsContainer = document.querySelector('.insights');
  insightsContainer.innerHTML = '';

  // Total (first numeric column)
  if (numericCols.length) {
    const col = numericCols[0];
    const total = data.reduce((sum, row) => sum + parseFloat(row[col] || 0), 0);

    addCard('Total ' + col, formatNumber(total));
  }

  // Top category
  if (categoricalCols.length) {
    const col = categoricalCols[0];
    const counts = {};

    data.forEach(row => {
      counts[row[col]] = (counts[row[col]] || 0) + 1;
    });

    const top = Object.entries(counts).sort((a,b) => b[1]-a[1])[0];

    addCard('Top ' + col, top[0]);
  }

  // Simple growth (if date + numeric exists)
  const dateCol = categoricalCols.find(c => c.toLowerCase().includes('date'));

  if (dateCol && numericCols.length) {
    const numCol = numericCols[0];

    const sorted = [...data].sort((a,b) => new Date(a[dateCol]) - new Date(b[dateCol]));

    const first = parseFloat(sorted[0][numCol]);
    const last = parseFloat(sorted[sorted.length - 1][numCol]);

    const growth = ((last - first) / first * 100).toFixed(1);

    addCard('Growth', growth + '%');
  }

}


/* ---------- ADD CARD ---------- */
function addCard(title, value) {
  const container = document.querySelector('.insights');

  const card = document.createElement('div');
  card.className = 'card';

  card.innerHTML = `
    <h4>${title}</h4>
    <p>${value}</p>
  `;

  container.appendChild(card);
}


/* ---------- UTIL ---------- */
function formatNumber(num) {
  return num.toLocaleString('en-IN');
}

</script>
